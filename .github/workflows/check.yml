name: Check casks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test updater
        run: python3 -m unittest discover -s scripts
      - name: Load tap
        run: brew tap jeff-business/tap "$GITHUB_WORKSPACE"
      - name: Check cask style and metadata
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          brew style --cask jeff-business/tap/gitler
          brew audit --cask jeff-business/tap/gitler
          brew style --cask jeff-business/tap/concentration-slop
          brew audit --cask --strict jeff-business/tap/concentration-slop
      - name: Verify Apple Silicon download
        run: |
          brew fetch --cask --arch=arm jeff-business/tap/gitler
          brew fetch --cask --arch=arm jeff-business/tap/concentration-slop
      - name: Verify Intel download
        run: |
          brew fetch --cask --arch=intel jeff-business/tap/gitler
          brew fetch --cask --arch=intel jeff-business/tap/concentration-slop
      - name: Verify application and command installation
        run: |
          brew install --cask --appdir="$RUNNER_TEMP/apps" jeff-business/tap/gitler
          test -d "$RUNNER_TEMP/apps/Gitler.app"
          test -x "$(brew --prefix)/bin/gitler"
          test "$(readlink "$(brew --prefix)/bin/gitler")" = "$RUNNER_TEMP/apps/Gitler.app/Contents/MacOS/gitler"
      - name: Verify Concentration Slop installation
        run: |
          brew install --cask --appdir="$RUNNER_TEMP/apps" jeff-business/tap/concentration-slop
          test -d "$RUNNER_TEMP/apps/Concentration Slop.app"
