name: Update Gitler

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gitler
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test release selection and checksum validation
        run: python3 -m unittest discover -s scripts
      - name: Update cask from published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_cask.py
      - name: Commit updated cask
        run: |
          if git diff --quiet -- Casks/gitler.rb; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/gitler.rb
          git commit -m 'Update Gitler cask'
          git push
